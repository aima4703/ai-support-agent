<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Support · Professional</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Neutral palette — corporate & clean */
      --bg-canvas: #F4F5F7;
      --bg-panel: #FFFFFF;
      --bg-subtle: #FAFBFC;
      --bg-hover: #F7F8FA;

      --ink-primary: #0F1419;
      --ink-secondary: #4A5568;
      --ink-tertiary: #8896AB;
      --ink-muted: #B0B9C6;

      --border-subtle: #E8ECF1;
      --border-default: #DDE3EB;
      --border-strong: #C8D0DC;

      --accent: #0B5FFF;
      --accent-hover: #0047CC;
      --accent-soft: #EBF2FF;
      --accent-border: #C7DBFF;

      --success: #0E9F6E;
      --success-soft: #E6F7F1;

      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', monospace;

      --shadow-xs: 0 1px 2px rgba(15, 20, 25, 0.04);
      --shadow-sm: 0 1px 3px rgba(15, 20, 25, 0.06), 0 1px 2px rgba(15, 20, 25, 0.04);
      --shadow-md: 0 4px 12px rgba(15, 20, 25, 0.06), 0 2px 4px rgba(15, 20, 25, 0.04);
      --shadow-lg: 0 12px 32px -8px rgba(15, 20, 25, 0.10), 0 4px 12px -2px rgba(15, 20, 25, 0.05);
      --shadow-focus: 0 0 0 3px rgba(11, 95, 255, 0.14);

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-xl: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-canvas);
      background-image:
        radial-gradient(circle at 0% 0%, rgba(11, 95, 255, 0.03) 0%, transparent 40%),
        radial-gradient(circle at 100% 100%, rgba(11, 95, 255, 0.02) 0%, transparent 40%);
      font-family: var(--font-sans);
      color: var(--ink-primary);
      padding: 32px 20px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
    }

    /* ============================================
       MAIN PANEL
       ============================================ */
    .support-panel {
      width: 100%;
      max-width: 640px;
      height: min(720px, calc(100vh - 64px));
      background: var(--bg-panel);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-xl);
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      position: relative;
    }

    /* ============================================
       HEADER
       ============================================ */
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, #0B5FFF 0%, #0047CC 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(11, 95, 255, 0.25);
    }

    .brand-mark svg {
      width: 20px;
      height: 20px;
      stroke: #FFFFFF;
      stroke-width: 1.8;
    }

    .brand-info {
      min-width: 0;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--ink-primary);
      line-height: 1.25;
    }

    .brand-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 3px;
    }

    .brand-meta-item {
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 500;
      color: var(--ink-tertiary);
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .brand-meta-dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--ink-muted);
      flex-shrink: 0;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 12px 6px 10px;
      background: var(--success-soft);
      border: 1px solid rgba(14, 159, 110, 0.18);
      border-radius: 100px;
      font-size: 12px;
      font-weight: 500;
      color: var(--success);
      letter-spacing: -0.005em;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      position: relative;
      flex-shrink: 0;
    }

    .status-dot::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: var(--success);
      opacity: 0.25;
      animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse-ring {
      0%, 100% { transform: scale(1); opacity: 0.25; }
      50% { transform: scale(1.4); opacity: 0; }
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      background: var(--bg-panel);
      color: var(--ink-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .icon-btn:hover {
      background: var(--bg-hover);
      border-color: var(--border-strong);
      color: var(--ink-primary);
    }

    .icon-btn svg {
      width: 16px;
      height: 16px;
      stroke-width: 1.8;
    }

    /* ============================================
       CHAT AREA
       ============================================ */
    .chat-area {
      flex: 1;
      padding: 28px 24px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      background: var(--bg-panel);
      scroll-behavior: smooth;
      min-height: 0;
    }

    .chat-area::-webkit-scrollbar {
      width: 6px;
    }

    .chat-area::-webkit-scrollbar-track {
      background: transparent;
    }

    .chat-area::-webkit-scrollbar-thumb {
      background: var(--border-default);
      border-radius: 100px;
    }

    .chat-area::-webkit-scrollbar-thumb:hover {
      background: var(--border-strong);
    }

    /* Date divider */
    .date-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 4px 0 4px;
      align-self: center;
    }

    .date-divider::before,
    .date-divider::after {
      content: '';
      height: 1px;
      flex: 1;
      background: var(--border-subtle);
    }

    .date-divider span {
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 500;
      color: var(--ink-tertiary);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* ============================================
       MESSAGE ROWS
       ============================================ */
    .msg-row {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      max-width: 82%;
      animation: msg-in 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes msg-in {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .msg-row.from-user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-row.from-agent {
      align-self: flex-start;
    }

    .msg-avatar {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-sm);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: -0.01em;
      user-select: none;
    }

    .from-agent .msg-avatar {
      background: linear-gradient(135deg, #0B5FFF 0%, #0047CC 100%);
      color: #FFFFFF;
      box-shadow: 0 1px 3px rgba(11, 95, 255, 0.2);
    }

    .from-user .msg-avatar {
      background: var(--ink-primary);
      color: #FFFFFF;
    }

    .msg-content {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .from-user .msg-content {
      align-items: flex-end;
    }

    .msg-bubble {
      padding: 11px 15px;
      border-radius: var(--radius-lg);
      font-size: 14px;
      line-height: 1.55;
      letter-spacing: -0.005em;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .from-agent .msg-bubble {
      background: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      color: var(--ink-primary);
      border-bottom-left-radius: 4px;
    }

    .from-user .msg-bubble {
      background: var(--ink-primary);
      color: #FFFFFF;
      border-bottom-right-radius: 4px;
      box-shadow: var(--shadow-xs);
    }

    .msg-time {
      font-size: 10.5px;
      font-weight: 500;
      color: var(--ink-muted);
      padding: 0 4px;
      letter-spacing: 0.01em;
      font-variant-numeric: tabular-nums;
    }

    /* ============================================
       TYPING INDICATOR
       ============================================ */
    .typing-indicator {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 0;
    }

    .typing-indicator span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--ink-tertiary);
      animation: typing-bounce 1.4s ease-in-out infinite;
    }

    .typing-indicator span:nth-child(2) {
      animation-delay: 0.16s;
    }

    .typing-indicator span:nth-child(3) {
      animation-delay: 0.32s;
    }

    @keyframes typing-bounce {
      0%, 60%, 100% {
        transform: translateY(0);
        opacity: 0.35;
      }
      30% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }

    /* ============================================
       COMPOSER
       ============================================ */
    .composer {
      padding: 16px 24px 20px;
      background: var(--bg-panel);
      border-top: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }

    .composer-inner {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      padding: 6px 6px 6px 16px;
      transition: all 0.15s ease;
    }

    .composer-inner:focus-within {
      border-color: var(--accent);
      background: var(--bg-panel);
      box-shadow: var(--shadow-focus);
    }

    .composer-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      color: var(--ink-primary);
      padding: 10px 0;
      resize: none;
      max-height: 120px;
      letter-spacing: -0.005em;
    }

    .composer-input::placeholder {
      color: var(--ink-tertiary);
    }

    .send-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 18px;
      background: var(--accent);
      color: #FFFFFF;
      border: none;
      border-radius: var(--radius-md);
      font-family: var(--font-sans);
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: -0.005em;
      cursor: pointer;
      transition: all 0.15s ease;
      flex-shrink: 0;
      box-shadow: 0 1px 3px rgba(11, 95, 255, 0.3);
    }

    .send-btn:hover:not(:disabled) {
      background: var(--accent-hover);
      box-shadow: 0 2px 8px rgba(11, 95, 255, 0.35);
    }

    .send-btn:active:not(:disabled) {
      transform: translateY(0.5px);
      box-shadow: 0 1px 2px rgba(11, 95, 255, 0.3);
    }

    .send-btn:focus-visible {
      outline: none;
      box-shadow: var(--shadow-focus), 0 1px 3px rgba(11, 95, 255, 0.3);
    }

    .send-btn:disabled {
      background: var(--border-default);
      color: var(--ink-muted);
      box-shadow: none;
      cursor: not-allowed;
    }

    .send-btn svg {
      width: 14px;
      height: 14px;
      stroke-width: 2;
    }

    .composer-hint {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      padding: 0 4px;
    }

    .composer-hint-text {
      font-size: 11px;
      color: var(--ink-tertiary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .kbd {
      display: inline-flex;
      align-items: center;
      padding: 1px 5px;
      background: var(--bg-panel);
      border: 1px solid var(--border-default);
      border-bottom-width: 2px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 500;
      color: var(--ink-secondary);
      line-height: 1.4;
    }

    /* ============================================
       RESPONSIVE
       ============================================ */
    @media (max-width: 640px) {
      body {
        padding: 0;
        background: var(--bg-panel);
      }

      .support-panel {
        max-width: 100%;
        height: 100vh;
        height: 100dvh;
        border-radius: 0;
        border: none;
        box-shadow: none;
      }

      .panel-header {
        padding: 14px 18px;
      }

      .brand-mark {
        width: 36px;
        height: 36px;
      }

      .chat-area {
        padding: 22px 18px 16px;
      }

      .composer {
        padding: 12px 18px 16px;
      }

      .msg-row {
        max-width: 90%;
      }

      .icon-btn {
        display: none;
      }
    }

    @media (max-width: 400px) {
      .brand-meta {
        display: none;
      }

      .status-pill {
        padding: 5px 10px 5px 8px;
        font-size: 11px;
      }

      .composer-hint {
        display: none;
      }
    }

    /* ============================================
       ACCESSIBILITY
       ============================================ */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>

  <div class="support-panel">

    <!-- ============ HEADER ============ -->
    <header class="panel-header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 8l-9-5-9 5 9 5 9-5z"/>
            <path d="M3 8v8l9 5 9-5V8"/>
            <path d="M12 13v8"/>
          </svg>
        </div>
        <div class="brand-info">
          <div class="brand-title">Order Support</div>
          <div class="brand-meta">
            <span class="brand-meta-item">Orders</span>
            <span class="brand-meta-dot"></span>
            <span class="brand-meta-item">Policy</span>
            <span class="brand-meta-dot"></span>
            <span class="brand-meta-item">Tracking</span>
          </div>
        </div>
      </div>

      <div class="header-actions">
        <div class="status-pill">
          <span class="status-dot"></span>
          Online
        </div>
        <button class="icon-btn" type="button" id="endBtn" aria-label="End conversation" title="End conversation">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- ============ CHAT ============ -->
    <main class="chat-area" id="chatBox" role="log" aria-live="polite" aria-label="Conversation"></main>

    <!-- ============ COMPOSER ============ -->
    <footer class="composer">
      <div class="composer-inner">
        <input
          type="text"
          id="messageInput"
          class="composer-input"
          placeholder="Ask about an order or a policy…"
          autocomplete="off"
          aria-label="Message"
        />
        <button id="sendBtn" class="send-btn" type="button" aria-label="Send message">
          <span>Send</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 2L11 13"/>
            <path d="M22 2l-7 20-4-9-9-4 20-7z"/>
          </svg>
        </button>
      </div>
      <div class="composer-hint">
        <span class="composer-hint-text">
          Press <span class="kbd">Enter</span> to send
        </span>
      </div>
    </footer>

  </div>

  <script>
    (function () {
      'use strict';

      const chatBox = document.getElementById('chatBox');
      const input = document.getElementById('messageInput');
      const sendBtn = document.getElementById('sendBtn');
      const endBtn = document.getElementById('endBtn');

      const AGENT_INITIAL = 'A';
      const USER_INITIAL = 'Y';

      // ------------------------------------------------------------
      // Helpers
      // ------------------------------------------------------------
      function formatTime(date = new Date()) {
        return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }

      function scrollToBottom() {
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      function createMessageRow(sender) {
        const row = document.createElement('div');
        row.className = `msg-row from-${sender}`;

        const avatar = document.createElement('div');
        avatar.className = 'msg-avatar';
        avatar.setAttribute('aria-hidden', 'true');
        avatar.textContent = sender === 'agent' ? AGENT_INITIAL : USER_INITIAL;

        const content = document.createElement('div');
        content.className = 'msg-content';

        const bubble = document.createElement('div');
        bubble.className = 'msg-bubble';

        const time = document.createElement('div');
        time.className = 'msg-time';
        time.textContent = formatTime();

        content.appendChild(bubble);
        content.appendChild(time);
        row.appendChild(avatar);
        row.appendChild(content);
        chatBox.appendChild(row);

        scrollToBottom();
        return bubble;
      }

      function addMessage(text, sender) {
        const bubble = createMessageRow(sender);
        bubble.textContent = text;
        return bubble;
      }

      function addTypingIndicator() {
        const bubble = createMessageRow('agent');
        bubble.innerHTML = `
          <span class="typing-indicator" aria-label="Agent is typing">
            <span></span><span></span><span></span>
          </span>`;
        return bubble;
      }

      function addDateDivider(label) {
        const divider = document.createElement('div');
        divider.className = 'date-divider';
        divider.innerHTML = `<span>${label}</span>`;
        chatBox.appendChild(divider);
      }

      // ------------------------------------------------------------
      // Reply engine — calls a real backend, same as the reference
      // waybill-theme file. No client-side regex guessing here:
      // the server is responsible for understanding the message
      // and returning the correct reply.
      // ------------------------------------------------------------
      async function fetchReply(message) {
        const response = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message }),
        });

        if (!response.ok) {
          throw new Error(`Server responded with ${response.status}`);
        }

        const data = await response.json();
        return data.reply;
      }

      // ------------------------------------------------------------
      // Send flow
      // ------------------------------------------------------------
      let isSending = false;

      async function sendMessage() {
        const text = input.value.trim();
        if (!text || isSending) return;

        addMessage(text, 'user');
        input.value = '';
        input.style.height = 'auto';

        isSending = true;
        sendBtn.disabled = true;

        const typingBubble = addTypingIndicator();

        try {
          const reply = await fetchReply(text);
          typingBubble.textContent = reply;
        } catch (err) {
          typingBubble.textContent = 'Something went wrong — is the server running?';
        } finally {
          isSending = false;
          sendBtn.disabled = false;
          scrollToBottom();
          input.focus();
        }
      }

      // ------------------------------------------------------------
      // Events
      // ------------------------------------------------------------
      sendBtn.addEventListener('click', sendMessage);

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      // Auto-grow input (for multi-line support)
      input.addEventListener('input', () => {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 120) + 'px';
      });

      // End conversation button — now actually wired up
      endBtn.addEventListener('click', () => {
        input.disabled = true;
        sendBtn.disabled = true;
        addMessage('Conversation ended.', 'agent');
      });

      // ------------------------------------------------------------
      // Initial state
      // ------------------------------------------------------------
      addDateDivider('Today');
      addMessage(
        'Welcome to Order Support. Ask me about an order — for example, “Where is order 4582?” — or a policy such as “What is your return policy?”',
        'agent'
      );

      input.focus();
    })();
  </script>

</body>
</html>
